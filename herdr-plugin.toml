id = "office-agency"
name = "Office Agency"
version = "0.0.1"
min_herdr_version = "0.9.3"
description = "Your agent fleet as a 2D office you can walk around"
platforms = ["linux", "macos"]

# Build the client on `herdr plugin install` (needs npm). `plugin link` skips
# these; run them yourself in a linked checkout.
[[build]]
command = ["npm", "--prefix", "client", "ci", "--no-audit", "--no-fund"]

[[build]]
command = ["npm", "--prefix", "client", "run", "build"]

# Opens the office in the browser, starting the background server if needed.
# The server adds nothing to the layout and exits when herdr stops.
[[actions]]
id = "open"
title = "Open office"
contexts = ["workspace"]
command = ["node", "scripts/open.mjs"]

[[actions]]
id = "stop"
title = "Stop office"
contexts = ["workspace"]
command = ["node", "scripts/stop.mjs"]

# On-demand view of the server log.
[[panes]]
id = "logs"
title = "Office logs"
placement = "split"
command = ["node", "scripts/logs.mjs"]
