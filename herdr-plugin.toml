id = "office-agency"
name = "Office Agency"
version = "0.0.1"
min_herdr_version = "0.9.3"
description = "Your agent fleet as a 2D office you can walk around"
platforms = ["linux", "macos"]

# The server lives in a pane so its lifetime and logs are visible.
# Closing the pane stops the office.
[[panes]]
id = "office"
title = "Office"
placement = "tab"
command = ["node", "server/index.mjs"]

# Opens the browser on a running office, or starts the server pane first.
[[actions]]
id = "open"
title = "Open office"
contexts = ["workspace"]
command = ["node", "scripts/open.mjs"]
